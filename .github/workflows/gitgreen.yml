name: GitGreen - Hourly 5-6 Commits

on:
  schedule:
    # Vietnam even hours (UTC odd hours): 6 commits
    - cron: '23 1-23/2 * * *'
    # Vietnam odd hours (UTC even hours): 5 commits
    - cron: '23 0-22/2 * * *'

  workflow_dispatch:
    inputs:
      commits:
        description: 'Number of commits for manual testing (1-50)'
        required: true
        default: '1'

permissions:
  contents: write

concurrency:
  group: gitgreen-autocommit
  cancel-in-progress: false

jobs:
  record-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Create activity commits
        env:
          TZ: Asia/Ho_Chi_Minh
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_COUNT: ${{ inputs.commits }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            count="$MANUAL_COUNT"
          elif [[ "$SCHEDULE" == '23 1-23/2 * * *' ]]; then
            count=6
          elif [[ "$SCHEDULE" == '23 0-22/2 * * *' ]]; then
            count=5
          else
            echo 'Unexpected trigger schedule' >&2
            exit 1
          fi

          if ! [[ "$count" =~ ^[0-9]+$ ]] || (( count < 1 || count > 50 )); then
            echo 'Commit count must be between 1 and 50.' >&2
            exit 1
          fi

          # A re-run of the same GitHub Actions run must not create duplicates.
          if [[ -f DAILY_ACTIVITY.md ]] && grep -Fq "| GitGreen run $GITHUB_RUN_ID |" DAILY_ACTIVITY.md; then
            echo "GitHub run $GITHUB_RUN_ID already recorded; skip."
            exit 0
          fi

          git config user.name 'tranthaigin'
          git config user.email '242965146+tranthaigin@users.noreply.github.com'

          for ((i=1; i<=count; i++)); do
            timestamp="$(date '+%Y-%m-%d %H:%M:%S %z')"
            printf '%s | GitGreen run %s | update %02d/%02d\n' \
              "$timestamp" "$GITHUB_RUN_ID" "$i" "$count" >> DAILY_ACTIVITY.md
            git add DAILY_ACTIVITY.md
            git commit -m "chore: GitGreen activity $i/$count ($GITHUB_RUN_ID)"
          done

          git push origin HEAD:main
